name: CI

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, zip, intl, pcntl
          coverage: none
          tools: composer:2.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Dependências PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Dependências JS
        run: npm ci

      - name: Build
        run: npm run build

      - name: Portão de qualidade
        run: composer gate
