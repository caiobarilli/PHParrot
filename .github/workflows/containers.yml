name: Containers

on:
  push:
    paths:
      - 'docker/**'
      - 'terraform/**'
      - '.hadolint.yaml'
      - '.github/workflows/containers.yml'
  pull_request:
    paths:
      - 'docker/**'
      - 'terraform/**'
      - '.hadolint.yaml'
      - '.github/workflows/containers.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_VERSAO: v0.76.1

jobs:
  hadolint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          recursive: true
          config: .hadolint.yaml

  imagens:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        alvo: [php, whisper, nginx]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Argumentos de build
        id: argumentos
        env:
          ALVO: ${{ matrix.alvo }}
        run: |
          if [ "$ALVO" = whisper ]; then
            sha1=$(sed -n 's/^ *base *= *"\([0-9a-f]\{40\}\)"$/\1/p' terraform/main.tf)
            test -n "$sha1"
            {
              echo 'build-args<<FIM'
              echo 'MODELO=base'
              echo "MODELO_SHA1=$sha1"
              echo 'FIM'
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/${{ matrix.alvo }}
          load: true
          push: false
          tags: phparrot-${{ matrix.alvo }}:ci
          build-args: ${{ steps.argumentos.outputs.build-args }}
          cache-from: type=gha,scope=${{ matrix.alvo }}
          cache-to: type=gha,mode=max,scope=${{ matrix.alvo }}

      - name: Trivy SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSAO }}
          scan-type: image
          image-ref: phparrot-${{ matrix.alvo }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-${{ matrix.alvo }}.sarif

      - name: Trivy SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSAO }}
          skip-setup-trivy: true
          scan-type: image
          image-ref: phparrot-${{ matrix.alvo }}:ci
          format: cyclonedx
          output: sbom-${{ matrix.alvo }}.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-${{ matrix.alvo }}
          path: trivy-${{ matrix.alvo }}.sarif
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.alvo }}
          path: sbom-${{ matrix.alvo }}.cdx.json
          if-no-files-found: error

      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSAO }}
          skip-setup-trivy: true
          scan-type: image
          image-ref: phparrot-${{ matrix.alvo }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSAO }}
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-config.sarif

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-config
          path: trivy-config.sarif
          if-no-files-found: error

      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSAO }}
          skip-setup-trivy: true
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'

  sarif:
    needs: [imagens, config]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        alvo: [php, whisper, nginx, config]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sarif-${{ matrix.alvo }}
          path: sarif
          merge-multiple: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ hashFiles(format('sarif/trivy-{0}.sarif', matrix.alvo)) != '' }}
        with:
          sarif_file: sarif/trivy-${{ matrix.alvo }}.sarif
          category: trivy-${{ matrix.alvo }}
